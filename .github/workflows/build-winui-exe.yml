name: Build WinUI Exe

on:
  push:
    branches:
      - copilot/merge-pr-10-winui-phase1
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: copilot/merge-pr-10-winui-phase1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build and Publish WinUI App
        run: |
          cd ChemSAGE-WinUI
          dotnet publish ChemSAGE-WinUI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:WindowsPackageType=None -o .\PublishOutput
        
      - name: Commit and Push executable
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ChemSAGE-WinUI/PublishOutput/* -f
          git commit -m "Add built executable for WinUI" || echo "No changes to commit"
          git push
