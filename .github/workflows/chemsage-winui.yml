name: Build ChemSAGE WinUI

on:
  push:
    paths:
      - "ChemSAGE-WinUI/**"
      - ".github/workflows/chemsage-winui.yml"

  pull_request:
    paths:
      - "ChemSAGE-WinUI/**"
      - ".github/workflows/chemsage-winui.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-winui:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: dotnet restore ChemSAGE-WinUI/ChemSAGE-WinUI.sln

      - name: Build WinUI project
        shell: cmd
        run: |
          msbuild ChemSAGE-WinUI\ChemSAGE-WinUI.sln /m /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64

      - name: Upload WinUI binaries
        uses: actions/upload-artifact@v4
        with:
          name: ChemSAGE-WinUI-win-x64-release
          path: ChemSAGE-WinUI/bin/x64/Release/**
          if-no-files-found: error
          retention-days: 14
